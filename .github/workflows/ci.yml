name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ech_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/ech_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Migration works on an empty database (and twice in a row)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/ech_test
          JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
        run: |
          npm run db:migrate
          npm run db:migrate
      - name: Tests
        run: npm test
      - name: Dependency audit (fails on high or critical)
        run: npm audit --omit=dev --audit-level=high

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000/api
      # Next 14 has advisories whose fixes require a major upgrade (PLAN.md
      # Phase 5). Reported but not blocking until that upgrade lands.
      - name: Dependency audit (informational)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
