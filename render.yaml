# Render blueprint for all of Excel Connect Hub: the API, the frontend and the
# database. One apply brings up the whole platform.
#
# Why not Vercel for the API: it serves uploaded images off the local filesystem
# (`express.static(UPLOAD_DIR)`) and keeps long-lived Postgres, Redis and SMTP
# connections. Vercel's serverless filesystem is ephemeral and read-only apart
# from /tmp, so uploaded images would 404 minutes after upload. Render runs an
# ordinary always-on Node process, so `server.js` deploys unchanged.
#
# Deploy: Render dashboard -> New + -> Blueprint -> pick this repo -> Apply.
# There is nothing to type: every value below is set, generated by Render, or
# wired to the database. A service created through the manual "Web Service"
# form ignores this file entirely.
# This file must stay at the repository root: that is the only place Render's
# Blueprint discovery looks. `rootDir: backend` below points it at the API.
#
# NOTE ON UPLOADS: the free plan has no persistent disk. Files survive while the
# instance lives, but a redeploy or a spin-down wipes them. To make uploads
# permanent, change `plan: free` to `plan: starter` and uncomment the `disk:`
# block below (Render charges for disks; the free plan rejects them).

services:
  - type: web
    name: excel-connect-hub-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health

    # disk:
    #   name: uploads
    #   mountPath: /opt/render/project/src/backend/uploads
    #   sizeGB: 1

    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        fromDatabase:
          name: excel-connect-hub-db
          property: connectionString

      # Generated once by Render and kept across deploys. Changing it logs
      # every user out, so let Render own it rather than pasting a value.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d

      # Render terminates TLS at its proxy, so the client IP only exists in
      # X-Forwarded-For. Without this the rate limiters bucket every visitor
      # together and one noisy client locks out the rest.
      - key: TRUST_PROXY
        value: "1"

      # The frontend service defined below. Comma-separate extra origins (a
      # custom domain, or http://localhost:3000 for local work against this
      # API). Until this matches exactly, the browser blocks every API call.
      - key: CLIENT_ORIGIN
        value: https://excel-connect-hub-web.onrender.com

      # Both services are on Render, so no Vercel preview origins to allow.
      # Set to "true" only if you also deploy the frontend to Vercel.
      - key: ALLOW_VERCEL_PREVIEWS
        value: "false"

      # Absolute origin used to build upload URLs, so image links are https and
      # point at the public host rather than at localhost.
      - key: PUBLIC_API_ORIGIN
        value: https://excel-connect-hub-api.onrender.com

      # SMTP is deliberately absent. mailer.js prints verification codes to the
      # service log when it is unconfigured, and every flow still works end to
      # end. Listing the keys here — even empty — would make Render stop and ask
      # for five values at apply time for no benefit. Add them in the dashboard
      # later to send real email.

      # Payments stay off until this is true, and checkout answers
      # "coming soon". No Flutterwave keys are needed to deploy.
      - key: PAYMENTS_ENABLED
        value: "false"

  # The Next.js frontend. A Web Service, not a Static Site: this app is not a
  # static export — it has server components and `next start` needs to run.
  - type: web
    name: excel-connect-hub-web
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start

    envVars:
      - key: NODE_VERSION
        value: "22"

      # Compiled into the browser bundle at BUILD time, so this cannot be
      # derived from the API service at runtime and changing it later needs a
      # rebuild, not just a restart. Correct it if Render assigns the API a
      # different hostname than the one below.
      - key: NEXT_PUBLIC_API_URL
        value: https://excel-connect-hub-api.onrender.com/api

databases:
  - name: excel-connect-hub-db
    plan: free
    databaseName: excel_connect_hub
    user: excel_connect_hub
