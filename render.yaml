# Render blueprint for the Excel Connect Hub API.
#
# Why Render and not Vercel: this API serves uploaded images off the local
# filesystem (`express.static(UPLOAD_DIR)`) and keeps a long-lived Postgres
# pool. Vercel's serverless filesystem is ephemeral and read-only apart from
# /tmp, so every uploaded image would 404 minutes after upload. Render runs a
# normal, always-on Node process, so `server.js` deploys unchanged.
#
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo.
# This file must stay at the repository root: that is the only place Render's
# Blueprint discovery looks. `rootDir: backend` below points it at the API.
#
# NOTE ON UPLOADS: the free plan has no persistent disk. Files survive while the
# instance lives, but a redeploy or a spin-down wipes them. To make uploads
# permanent, change `plan: free` to `plan: starter` and uncomment the `disk:`
# block below (Render charges for disks; the free plan rejects them).

services:
  - type: web
    name: excel-connect-hub-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health

    # disk:
    #   name: uploads
    #   mountPath: /opt/render/project/src/backend/uploads
    #   sizeGB: 1

    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        fromDatabase:
          name: excel-connect-hub-db
          property: connectionString

      # Generated once by Render and kept across deploys. Changing it logs
      # every user out, so let Render own it rather than pasting a value.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d

      # Render terminates TLS at its proxy, so the client IP only exists in
      # X-Forwarded-For. Without this the rate limiters bucket every visitor
      # together and one noisy client locks out the rest.
      - key: TRUST_PROXY
        value: "1"

      # Set to the Vercel frontend URL after its first deploy. Comma-separate
      # extra origins. Until this is right, the browser blocks every API call.
      - key: CLIENT_ORIGIN
        sync: false

      # Accept https://*.vercel.app preview deployments as well. Turn this off
      # once you are done testing.
      - key: ALLOW_VERCEL_PREVIEWS
        value: "true"

      # Absolute origin used to build upload URLs, so links are https and point
      # at the public host rather than at localhost.
      - key: PUBLIC_API_ORIGIN
        sync: false

      # --- Optional, all safe to leave unset ---------------------------------
      # Without SMTP, verification codes are printed to the Render logs and the
      # app still works end to end.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false

      # Payments stay off until this is true, and checkout answers
      # "coming soon". No Flutterwave keys are needed to deploy.
      - key: PAYMENTS_ENABLED
        value: "false"

databases:
  - name: excel-connect-hub-db
    plan: free
    databaseName: excel_connect_hub
    user: excel_connect_hub
